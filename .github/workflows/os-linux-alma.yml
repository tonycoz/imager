name: os-linux-alma

on:
  workflow_call:

jobs:
  os-linux-alma:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    timeout-minutes: 10
    steps:
      - name: install dependencies
        run: |
            dnf install -y --enablerepo=powertools '@Development Tools' libtiff-devel libpng-devel giflib-devel freetype-devel libjpeg-devel perl-Test-Pod-Coverage perl-Test-Pod perl-Pod-Parser cpanminus
            cpanm Parse::RecDescent
      - name: checkout
        uses: actions/checkout@v6
      - name: git annoyance
        run: git config --global --add safe.directory /__w/imager/imager
      - name: configure
        run: |
          perl Makefile.PL
      - name: build
        run: |
            make -j2
      - name: test
        run: |
            HARNESS_OPTIONS=j2 IMAGER_AUTHOR_TESTING=1 IMAGER_RISKY_TESTS=1 make test
