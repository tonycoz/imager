name: os-linux

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'
  pull_request:


jobs:
  os-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: install package dependencies cached
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: build-essential libtiff-dev libpng-dev libgif-dev libfreetype6-dev libjpeg-dev aspell
          version: 1.2
      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1.41.1
        with:
          perl-version: '5'
          multi-thread: true
          install-modules:
            Affix::Infix2Postfix
            ExtUtils::MakeMaker
            Inline::C
            Inline::CPP
            Parse::RecDescent
            Perl::OSType
            Pod::Spell
            Scalar::Util
            Socket
            Test::Pod
            Test::Pod::Coverage
            version
      - name: perl -V
        run: |
            perl -V
      - name: checkout
        uses: actions/checkout@v6
        with:
          path: imager
      - name: configure
        run: |
          cd imager && perl Makefile.PL OPTIMIZE="-Wall -Wextra -Werror -O3 -g"
      - name: build
        run: |
          cd imager && make -j2
      - name: test
        run: |
          cd imager && make HARNESS_OPTIONS=j2 IMAGER_AUTHOR_TESTING=1 IMAGER_RISKY_TESTS=1 test

  os-linux-i386:
    needs: os-linux
    uses: ./.github/workflows/os-linux-i386.yml

  os-linux-nothr:
    needs: os-linux
    uses: ./.github/workflows/os-linux-nothr.yml

  os-linux-rocky:
    needs: os-linux
    uses: ./.github/workflows/os-linux-rocky.yml

  os-macos:
    needs: os-linux
    uses: ./.github/workflows/os-macos.yml

  os-freebsd:
    needs: os-linux
    strategy:
      matrix:
        os-release:
          - "13.5"
          - "15.0"
    uses: ./.github/workflows/os-freebsd.yml
    with:
      os-release: ${{ matrix.os-release }}

  os-netbsd:
    needs: os-linux
    uses: ./.github/workflows/os-netbsd.yml

  os-openbsd:
    needs: os-linux
    uses: ./.github/workflows/os-openbsd.yml

  os-mswin32-cygwin:
    needs: os-linux
    uses: ./.github/workflows/os-mswin32-cygwin.yml

  os-mswin32-mingw64:
    needs: os-linux
    uses: ./.github/workflows/os-mswin32-mingw64.yml

  library-raw-probe:
    needs: os-linux
    uses: ./.github/workflows/library-raw-probe.yml

  library-tiff:
    needs: os-linux
    uses: ./.github/workflows/library-tiff.yml

  perl-versions:
    needs: os-linux
    uses: ./.github/workflows/perl-versions.yml

  quality-coverage:
    needs: os-linux
    uses: ./.github/workflows/quality-coverage.yml

  quality-reverse-deps:
    needs: os-linux
    uses: ./.github/workflows/quality-reverse-deps.yml

  quality-valgrind:
    needs: os-linux
    uses: ./.github/workflows/quality-valgrind.yml

  quality-tidy:
    needs: os-linux
    uses: ./.github/workflows/quality-tidy.yml
